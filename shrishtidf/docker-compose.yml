services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shrishti
      POSTGRES_PASSWORD: shrishti
      POSTGRES_DB: shrishti_dairy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend-node
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:Root@123@backend-node-db-1:5432/shrishti_dairy?schema=public
      JWT_SECRET: supersecret_shrishti
    networks:
      - default
      - old_backend
    # depends_on:
    #   - postgres  # Removed because we connect to the external old database instead

  admin_panel:
    build:
      context: ./admin-panel
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  delivery_app:
    build:
      context: ./delivery-app
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    ports:
      - "3060:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - admin_panel
      - delivery_app
      - backend

networks:
  default:
  old_backend:
    name: backend-node_default
    external: true

volumes:
  postgres_data:
