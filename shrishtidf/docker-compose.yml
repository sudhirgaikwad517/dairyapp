services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shrishti
      POSTGRES_PASSWORD: shrishti
      POSTGRES_DB: shrishti_dairy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    # The one FastAPI backend for everything: the website and browser app (through the gateway below),
    # and the phone app, admin panel and ERP at erp.shrishtidairyfarm.com/api (the server's nginx -> port 3050).
    build:
      context: ./backend-python
    restart: unless-stopped
    # DATABASE_URL, JWT_SECRET and the Razorpay keys live in backend-python/.env on the server (not in git)
    env_file:
      - ./backend-python/.env
    ports:
      - "3050:5555"
    volumes:
      # Uploaded files survive a rebuild of the backend container
      - uploads:/app/uploads
    networks:
      - default
      - old_backend
    # depends_on:
    #   - postgres  # Removed because we connect to the external old database instead

  admin_panel:
    build:
      context: ./admin-panel
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  customer_web:
    build:
      # The Flutter customer app for the browser; make customer-web/html first with customer-web/build.sh
      context: ./customer-web
    restart: unless-stopped
    depends_on:
      - backend

  delivery_app:
    build:
      context: ./delivery-app
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    ports:
      - "3060:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - customer_web
      - admin_panel
      - delivery_app
      - backend

networks:
  default:
  old_backend:
    name: backend-node_default
    external: true

volumes:
  postgres_data:
  uploads:
