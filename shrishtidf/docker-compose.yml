services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shrishti
      POSTGRES_PASSWORD: shrishti
      POSTGRES_DB: shrishti_dairy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend-node
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shrishti:shrishti@postgres:5432/shrishti_dairy?schema=public
      JWT_SECRET: supersecret_shrishti
    depends_on:
      - postgres

  admin_panel:
    build:
      context: ./admin-panel
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - admin_panel
      - backend

volumes:
  postgres_data:
