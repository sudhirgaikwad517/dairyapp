<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shrishti Dairy Farm: order milk, manage your subscription, wallet and bills.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#6156F1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shrishti Dairy">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Shrishti Dairy Farm</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The splash screen's empty milk circle, shown while the app downloads */
    html, body { margin: 0; background: #f3f7fc; }
    #app-loader {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: linear-gradient(165deg, #fffbf7 0%, #f3f7fc 55%, #e8f0fa 100%);
    }
    #app-loader div {
      width: 152px; height: 152px; box-sizing: border-box; border-radius: 50%;
      border: 3px solid #1a3d72; background: #fff; display: grid; place-items: center;
      box-shadow: 0 0 0 6px rgb(26 61 114 / 12%), 0 18px 40px rgb(26 61 114 / 22%);
    }
    #app-loader img { width: 72%; height: 72%; object-fit: contain; }
  </style>
</head>
<body>
  <div id="app-loader"><div><img src="icons/splash-logo.png" alt=""></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (loader) loader.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Online payments in the browser (the phone app uses Razorpay's Android / iOS sheet) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
